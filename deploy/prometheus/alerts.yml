# Thresholds come from docs/reports/latency-targets-2026-10-24.md; tests are in alerts_test.yml.
groups:
  - name: chatbot
    rules:
      - alert: NoWorkerUp
        # A stopped container leaves Docker DNS, so its target disappears rather than reporting 0.
        expr: absent(up{job="worker"} == 1)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: No worker is scraped as up; chat requests are not being consumed.

      - alert: ConsumerLagHigh
        expr: sum(kafka_consumergroup_lag{consumergroup="chat-workers", topic="chat-requests"}) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} chat requests are waiting; workers are not keeping up."

      - alert: RecordsDeadLettered
        # Read from the broker, so a worker restart cannot reset it.
        expr: sum(increase(kafka_topic_partition_current_offset{topic="chat-requests.dlq"}[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Records reached chat-requests.dlq in the last 10 minutes.

      - alert: GatewayErrorRateHigh
        expr: |
          sum(rate(chatbot_gateway_requests_total{status=~"5.."}[5m]))
            / sum(rate(chatbot_gateway_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: More than 5% of gateway requests end in a 5xx.

      - alert: ChatAcceptSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(chatbot_gateway_request_seconds_bucket{method="POST", route="/chat"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: POST /chat p95 is above the 1 s target.

      - alert: QueueDelayHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(chatbot_worker_queue_delay_seconds_bucket[5m])))
            > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Queue delay p95 is above the 500 ms target.
