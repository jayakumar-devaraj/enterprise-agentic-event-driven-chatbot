# Scrapes the gateway, worker and RAG service /metrics (port 9100, never published), Qdrant's own
# /metrics, and the Redis and Kafka exporters. The model server is measured by the worker, its client.
# Docker DNS returns one address per replica, so `--scale` needs no change here.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    dns_sd_configs:
      - names: [gateway]
        type: A
        port: 9100
  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
  # Profile `rag`: without it the name does not resolve and the job has no targets.
  - job_name: rag-api
    dns_sd_configs:
      - names: [rag-api]
        type: A
        port: 9100
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: qdrant
    scheme: https
    authorization:
      credentials_file: /tmp/qdrant-api-key  # written by the container at start (compose.yaml)
    tls_config:
      ca_file: /certs/ca.crt
    static_configs:
      - targets: ["qdrant:6333"]
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
