# Scrapes the gateway, worker and RAG service /metrics (port 9100, never published) and the Kafka lag
# exporter.
# Docker DNS returns one address per replica, so `--scale` needs no change here.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    dns_sd_configs:
      - names: [gateway]
        type: A
        port: 9100
  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
  # Profile `rag`: without it the name does not resolve and the job has no targets.
  - job_name: rag-api
    dns_sd_configs:
      - names: [rag-api]
        type: A
        port: 9100
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
