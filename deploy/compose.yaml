# Infrastructure for the event-driven chatbot. Run from the repo root:
#   docker compose -f deploy/compose.yaml up -d --wait
# Host ports bind to 127.0.0.1 and default to non-standard numbers so they do not collide with
# other local stacks; containers talk to each other on the standard ports.
name: chatbot

services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_HOST_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-19092}:19092"
    # A TCP probe, not a Kafka CLI tool: each CLI call starts a JVM (~2 CPU-seconds), which at a
    # 5 s interval kept the container near 200 % CPU while idle. kafka-init below performs the real
    # broker round trip once, before topics are created.
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for i in $(seq 1 30); do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1 && break
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic ${KAFKA_TOPIC:-chat-requests} --partitions ${KAFKA_PARTITIONS:-4} --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic ${KAFKA_DLQ_TOPIC:-chat-requests.dlq} --partitions 1 --replication-factor 1
    restart: "no"

  redis:
    image: redis:8.10.2
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-16333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_HOST_PORT:-16334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:${JAEGER_UI_HOST_PORT:-16686}:16686"
      - "127.0.0.1:${OTLP_GRPC_HOST_PORT:-14317}:4317"
      - "127.0.0.1:${OTLP_HTTP_HOST_PORT:-14318}:4318"

  # Real inference (A9). Off by default: `--profile llm`. The model is pulled at image build time.
  ollama:
    profiles: ["llm"]
    build:
      context: ollama
      args:
        LLM_MODEL: ${LLM_MODEL:-llama3.2:1b}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: loads the Qdrant collections and calibrates thresholds; fails loudly.
  seed:
    build:
      context: ..
      dockerfile: services/seed/Dockerfile
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    env_file:
      - path: ../.env
        required: false
    depends_on:
      seed:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Stateless: scale freely (`--scale gateway=2`); each replica gets a host port from the range.
  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      # Exported in the shell: `export AUTH_USERS="$(uv run python -m gateway.auth demo demo-pw)"`.
      AUTH_USERS: ${AUTH_USERS:-}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORTS:-8000-8003}:8000"
    restart: unless-stopped

  # React chat window (Vite dev server). /api is proxied to the gateway service.
  frontend:
    build: ../frontend
    environment:
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8000}
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
