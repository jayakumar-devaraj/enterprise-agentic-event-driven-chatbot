# Infrastructure for the event-driven chatbot. Run from the repo root:
#   docker compose -f deploy/compose.yaml up -d --wait
# Host ports bind to 127.0.0.1 and default to non-standard numbers so they do not collide with
# other local stacks; containers talk to each other on the standard ports.
name: chatbot

services:
  # One-shot: a development CA and one server certificate for redis, kafka, qdrant, localhost and
  # 127.0.0.1, written to deploy/certs (gitignored) once and reused. Host-side clients trust ca.crt.
  certs:
    image: apache/kafka:4.3.1
    user: "0"
    volumes:
      - ./certs:/certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cd /certs
        if [ -s server.pem ] && [ -s ca.crt ]; then exit 0; fi
        # Key usage and identifiers as strict verifiers (Python 3.13+) require them.
        openssl req -x509 -newkey rsa:3072 -nodes -days 825 -subj "/CN=chatbot development CA" \
          -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign" \
          -addext "subjectKeyIdentifier=hash" -keyout ca.key -out ca.crt
        openssl req -newkey rsa:3072 -nodes -subj "/CN=chatbot-infra" -keyout server.key -out server.csr
        printf '%s\n' 'subjectAltName=DNS:redis,DNS:kafka,DNS:qdrant,DNS:localhost,IP:127.0.0.1' \
          'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature,keyEncipherment' \
          'extendedKeyUsage=serverAuth' 'subjectKeyIdentifier=hash' 'authorityKeyIdentifier=keyid,issuer' \
          > san.ext
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 825 \
          -extfile san.ext -out server.crt
        cat server.key server.crt > server.pem
        rm -f server.csr san.ext ca.srl
        # Readable by the non-root redis and kafka users; a development key, never a production one.
        chmod 644 ca.crt server.crt server.key server.pem
        chmod 600 ca.key
    restart: "no"

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_HOST_PORT:-19092}
      # Every listener, the controller's included, is TLS and needs SASL/PLAIN as `chatbot` (ADR 0015).
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SASL_SSL,INTERNAL:SASL_SSL,EXTERNAL:SASL_SSL
      KAFKA_SSL_KEYSTORE_TYPE: PEM
      KAFKA_SSL_KEYSTORE_LOCATION: /certs/server.pem
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_SSL_TRUSTSTORE_LOCATION: /certs/ca.crt
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="chatbot" password="${KAFKA_PASSWORD:?export KAFKA_PASSWORD, e.g. $(openssl rand -hex 16)}" user_chatbot="${KAFKA_PASSWORD:?export KAFKA_PASSWORD, e.g. $(openssl rand -hex 16)}";'
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="chatbot" password="${KAFKA_PASSWORD:?export KAFKA_PASSWORD, e.g. $(openssl rand -hex 16)}" user_chatbot="${KAFKA_PASSWORD:?export KAFKA_PASSWORD, e.g. $(openssl rand -hex 16)}";'
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="chatbot" password="${KAFKA_PASSWORD:?export KAFKA_PASSWORD, e.g. $(openssl rand -hex 16)}" user_chatbot="${KAFKA_PASSWORD:?export KAFKA_PASSWORD, e.g. $(openssl rand -hex 16)}";'
      # Read by deploy/kafka/cli.sh in `docker compose exec kafka`.
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:?export KAFKA_PASSWORD, e.g. $(openssl rand -hex 16)}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # The image default is /tmp/kafka-logs, which a recreated container loses.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # The default heap is 1 GiB; a single-node dev broker needs far less.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./kafka/cli.sh:/opt/chatbot/cli.sh:ro
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-19092}:19092"
    depends_on:
      certs:
        condition: service_completed_successfully
    # A TCP probe, not a Kafka CLI tool: each CLI call starts a JVM (~2 CPU-seconds), which at a
    # 5 s interval kept the container near 200 % CPU while idle. kafka-init below performs the real
    # broker round trip once, before topics are created.
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 15s
    # JVM startup otherwise spikes past 300 % CPU.
    cpus: 2
    mem_limit: 1g
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:?export KAFKA_PASSWORD, e.g. $(openssl rand -hex 16)}
    volumes:
      - ./kafka/cli.sh:/opt/chatbot/cli.sh:ro
      - ./certs:/certs:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for i in $(seq 1 30); do
          sh /opt/chatbot/cli.sh kafka-topics.sh --list >/dev/null 2>&1 && break
          sleep 2
        done
        sh /opt/chatbot/cli.sh kafka-topics.sh --create --if-not-exists \
          --topic ${KAFKA_TOPIC:-chat-requests} --partitions ${KAFKA_PARTITIONS:-4} --replication-factor 1
        # Retention bounds how long a record can be redelivered; DEDUPE_TTL_S must outlive it (SPEC §5).
        # --alter also covers a topic created before these settings existed.
        sh /opt/chatbot/cli.sh kafka-configs.sh --alter --entity-type topics \
          --entity-name ${KAFKA_TOPIC:-chat-requests} \
          --add-config retention.ms=${KAFKA_RETENTION_MS:-604800000},segment.ms=${KAFKA_SEGMENT_MS:-86400000}
        sh /opt/chatbot/cli.sh kafka-topics.sh --create --if-not-exists \
          --topic ${KAFKA_DLQ_TOPIC:-chat-requests.dlq} --partitions 1 --replication-factor 1
    restart: "no"

  redis:
    image: redis:8.10.2
    # AOF fsynced every second (RPO ≤ 1 s for acknowledged writes) on a named volume, so streams,
    # checkpoints, owners, refunds and the audit trail survive a crash or a recreated container.
    # One ACL user, `chatbot`, with the password from REDIS_PASSWORD; the passwordless default user
    # is off, so no client on the network or the host port gets in without it.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --user
      - default
      - "off"
      - --user
      - chatbot
      - "on"
      - ">${REDIS_PASSWORD:?export REDIS_PASSWORD, e.g. $(openssl rand -hex 16)}"
      - "~*"
      - "&*"
      - "+@all"
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /certs/server.crt
      - --tls-key-file
      - /certs/server.key
      - --tls-ca-cert-file
      - /certs/ca.crt
      - --tls-auth-clients
      - "no"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?export REDIS_PASSWORD, e.g. $(openssl rand -hex 16)}
    volumes:
      - redis-data:/data
      - ./certs:/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /certs/ca.crt --no-auth-warning --user chatbot --pass \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.2
    environment:
      # Every REST and gRPC call needs this key (ADR 0015).
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?export QDRANT_API_KEY, e.g. $(openssl rand -hex 16)}
      QDRANT__SERVICE__ENABLE_TLS: "true"
      QDRANT__TLS__CERT: /certs/server.crt
      QDRANT__TLS__KEY: /certs/server.key
    volumes:
      - ./certs:/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-16333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_HOST_PORT:-16334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:${JAEGER_UI_HOST_PORT:-16686}:16686"
      - "127.0.0.1:${OTLP_GRPC_HOST_PORT:-14317}:4317"
      - "127.0.0.1:${OTLP_HTTP_HOST_PORT:-14318}:4318"
    mem_limit: 512m
    restart: unless-stopped

  # Real inference (A9). Off by default: `--profile llm`. The model is pulled at image build time.
  ollama:
    profiles: ["llm"]
    build:
      context: ollama
      args:
        LLM_MODEL: ${LLM_MODEL:-llama3.2:1b}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    cpus: 4
    mem_limit: 3g

  # One-shot: loads the Qdrant collections and calibrates thresholds; fails loudly.
  seed:
    build:
      context: ..
      dockerfile: services/seed/Dockerfile
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:?export QDRANT_API_KEY, e.g. $(openssl rand -hex 16)}
      QDRANT_URL: https://qdrant:6333
    volumes:
      - ./certs:/certs:ro
    # ONNX embedding sizes its thread pool to every host core; cap it so calibration cannot starve
    # the other stacks sharing the Docker VM.
    cpus: 2
    mem_limit: 1536m
    restart: "no"

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      # Real inference: `MOCK_LLM=false docker compose --profile llm up -d` (A9).
      MOCK_LLM: ${MOCK_LLM:-true}
      REDIS_URL: rediss://chatbot:${REDIS_PASSWORD:?export REDIS_PASSWORD, e.g. $(openssl rand -hex 16)}@redis:6379/0?ssl_ca_certs=/certs/ca.crt
      QDRANT_API_KEY: ${QDRANT_API_KEY:?export QDRANT_API_KEY, e.g. $(openssl rand -hex 16)}
      QDRANT_URL: https://qdrant:6333
      GRPC_DEFAULT_SSL_ROOTS_FILE_PATH: /certs/ca.crt
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:?export KAFKA_PASSWORD, e.g. $(openssl rand -hex 16)}
    depends_on:
      seed:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # Present only with `--profile rag`; without it the worker starts and document questions
      # end with a fixed error.
      rag-api:
        condition: service_healthy
        required: false
    cpus: 2
    volumes:
      - ./certs:/certs:ro
    mem_limit: 1536m
    restart: unless-stopped

  # Stateless: scale freely (`--scale gateway=2`); each replica gets a host port from the range.
  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      # Exported in the shell: `export AUTH_USERS="$(uv run python -m gateway.auth demo demo-pw)"`.
      AUTH_USERS: ${AUTH_USERS:-}
      # OIDC instead of Basic (ADR 0016): with profile `oidc`, OIDC_ISSUER=http://localhost:18080/realms/chatbot
      # and OIDC_DISCOVERY_URL=http://keycloak:8080/realms/chatbot/.well-known/openid-configuration.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-chatbot-gateway}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      REDIS_URL: rediss://chatbot:${REDIS_PASSWORD:?export REDIS_PASSWORD, e.g. $(openssl rand -hex 16)}@redis:6379/0?ssl_ca_certs=/certs/ca.crt
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:?export KAFKA_PASSWORD, e.g. $(openssl rand -hex 16)}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORTS:-8000-8003}:8000"
    cpus: 1
    volumes:
      - ./certs:/certs:ro
    mem_limit: 1536m
    restart: unless-stopped

  # Document questions (profile `rag`): the RAG service from its published image, never its source,
  # plus its own pgvector database. Export RAG_TENANT_TOKENS (token:tenant,...), RAG_DB_PASSWORD (the
  # schema owner) and RAG_APP_DB_PASSWORD (the API's role) in the shell, as with AUTH_USERS. The
  # service reaches the same Ollama as the worker.
  rag-db:
    profiles: ["rag"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:-}
      POSTGRES_DB: rag
    volumes:
      - rag-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  # One-shot: the non-owner role the RAG API connects as, so row-level security applies to it (the
  # owner is a superuser and bypasses it). Idempotent, so it also runs against an existing volume.
  rag-db-role:
    profiles: ["rag"]
    image: pgvector/pgvector:pg16
    environment:
      PGPASSWORD: ${RAG_DB_PASSWORD:-}
      APP_DB_PASSWORD: ${RAG_APP_DB_PASSWORD:-}
    depends_on:
      rag-db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        [ -n "$$APP_DB_PASSWORD" ] || { echo "export RAG_APP_DB_PASSWORD" >&2; exit 1; }
        psql -v ON_ERROR_STOP=1 -v app_pw="$$APP_DB_PASSWORD" -h rag-db -U rag -d rag <<'SQL'
        SELECT format(CASE WHEN EXISTS (SELECT FROM pg_roles WHERE rolname = 'rag_app')
                           THEN 'ALTER ROLE rag_app LOGIN PASSWORD %L'
                           ELSE 'CREATE ROLE rag_app LOGIN PASSWORD %L' END
                      || ' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS', :'app_pw') \gexec
        SQL
    restart: "no"

  # One-shot: the RAG schema, as the owner, then grants to rag_app. The API refuses an unmigrated
  # database. Same release as rag-api; moving one moves both.
  rag-migrate:
    profiles: ["rag"]
    image: ${RAG_MIGRATE_IMAGE:-ghcr.io/jayakumar-devaraj/multi-tenant-agentic-rag-migrate:v0.2.1@sha256:0934afae9b4c905094d05d78aae547209d240b0508cd3c3323273fb9b80cbb48}
    environment:
      MIGRATION_DATABASE_URL: postgresql://rag:${RAG_DB_PASSWORD:-}@rag-db:5432/rag
      APP_DB_ROLE: rag_app
    depends_on:
      rag-db-role:
        condition: service_completed_successfully
    restart: "no"

  rag-api:
    profiles: ["rag"]
    # Release v0.2.1 of the RAG service's published image, pinned by its index digest: a re-pushed tag
    # cannot change what runs here. Its API contract is docs/contracts/. Prometheus scrapes its
    # /metrics on port 9100, which is not published.
    image: ${RAG_API_IMAGE:-ghcr.io/jayakumar-devaraj/multi-tenant-agentic-rag:v0.2.1@sha256:45d6a56cca95e89ed33f5fbd53becf809c62191115a40ed8c232ee3200be1eb3}
    environment:
      DATABASE_URL: postgresql://rag_app:${RAG_APP_DB_PASSWORD:-}@rag-db:5432/rag
      # The same value the worker reads as RAG_TENANT_TOKENS, so the two cannot disagree.
      TENANT_TOKENS: ${RAG_TENANT_TOKENS:-}
      # This profile authenticates with static tokens, which the RAG service accepts only when told to
      # (opt-in since multi-tenant-agentic-rag#35).
      ALLOW_STATIC_TOKENS: "true"
      FASTEMBED_MODEL: BAAI/bge-small-en-v1.5
      # Its sufficiency check uses the chatbot's OpenAI-compatible endpoint; no real key is needed.
      OPENAI_API_KEY: unused
      OPENAI_CHAT_MODEL: ${LLM_MODEL:-llama3.2:1b}
      OPENAI_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      RETRIEVE_LLM_MAX_RETRIES: "0"
    depends_on:
      rag-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${RAG_API_HOST_PORT:-18000}:8000"
    mem_limit: 1536m
    restart: unless-stopped

  # One-shot: uploads the committed fixture document as tenant T1 through the service's /ingest.
  rag-seed:
    profiles: ["rag"]
    image: curlimages/curl:8.22.0
    environment:
      RAG_TENANT_TOKENS: ${RAG_TENANT_TOKENS:-}
    volumes:
      - ./rag/handbook.txt:/fixture/handbook.txt:ro
    depends_on:
      rag-api:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        token=$$(echo "$$RAG_TENANT_TOKENS" | tr ',' '\n' | awk -F: '$$2=="T1" {print $$1}')
        [ -n "$$token" ] || { echo "RAG_TENANT_TOKENS has no token for tenant T1" >&2; exit 1; }
        curl -fsS -X POST -H "Authorization: Bearer $$token" \
          -F "file=@/fixture/handbook.txt" http://rag-api:8000/ingest
    restart: "no"

  # React chat window (Vite dev server). /api is proxied to the gateway service.
  frontend:
    build: ../frontend
    environment:
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8000}
      # Set with OIDC_ISSUER so the window signs in through the same issuer.
      VITE_OIDC_ISSUER: ${OIDC_ISSUER:-}
      VITE_OIDC_CLIENT_ID: chatbot-web
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    mem_limit: 512m
    restart: unless-stopped

  # Tier 3: HTTPS (HTTP/2) entry point. https://localhost:8443 — trust Caddy's internal CA or use -k.
  caddy:
    image: caddy:2.11.7
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      gateway:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "127.0.0.1:${HTTPS_HOST_PORT:-8443}:443"
    mem_limit: 256m
    restart: unless-stopped

  # Durable audit record (ADR 0011): the exporter moves `audit:events` from Redis into an append-only
  # Postgres table. Profile `audit`; export AUDIT_DB_PASSWORD and AUDIT_WRITER_PASSWORD first.
  audit-db:
    profiles: ["audit"]
    image: postgres:16.14
    environment:
      POSTGRES_USER: audit_admin
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-}
      POSTGRES_DB: audit
      AUDIT_WRITER_USER: audit_writer
      AUDIT_WRITER_PASSWORD: ${AUDIT_WRITER_PASSWORD:-}
    volumes:
      - audit-data:/var/lib/postgresql/data
      - ./audit/001_init.sh:/docker-entrypoint-initdb.d/001_init.sh:ro
    ports:
      - "127.0.0.1:${AUDIT_DB_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_admin -d audit"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  audit-exporter:
    profiles: ["audit"]
    build:
      context: ..
      dockerfile: services/audit/Dockerfile
    environment:
      REDIS_URL: rediss://chatbot:${REDIS_PASSWORD:?export REDIS_PASSWORD, e.g. $(openssl rand -hex 16)}@redis:6379/0?ssl_ca_certs=/certs/ca.crt
      AUDIT_DATABASE_URL: postgresql://audit_writer:${AUDIT_WRITER_PASSWORD:-}@audit-db:5432/audit
    depends_on:
      redis:
        condition: service_healthy
      audit-db:
        condition: service_healthy
    volumes:
      - ./certs:/certs:ro
    mem_limit: 512m
    restart: unless-stopped

  # Metrics and alerts (profile `ops`): Prometheus scrapes the gateway and worker on their unpublished
  # port 9100 and the lag exporter; rules in prometheus/alerts.yml; the alertmanager service below
  # delivers firing alerts to ALERT_WEBHOOK_URL.
  kafka-exporter:
    profiles: ["ops"]
    image: danielqsj/kafka-exporter:v1.11.0
    # Only the chat topics and the workers' group: walking __consumer_offsets made scrapes time out.
    command:
      - --kafka.server=kafka:9092
      - --kafka.version=3.9.0
      - --tls.enabled
      - --tls.ca-file=/certs/ca.crt
      - --sasl.enabled
      - --sasl.mechanism=plain
      - --sasl.username=chatbot
      - --sasl.password=${KAFKA_PASSWORD:?export KAFKA_PASSWORD, e.g. $(openssl rand -hex 16)}
      - --topic.filter=^chat-requests
      - --group.filter=^chat-workers$
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./certs:/certs:ro
    mem_limit: 128m
    restart: unless-stopped

  prometheus:
    profiles: ["ops"]
    image: prom/prometheus:v3.15.1
    # Qdrant's /metrics needs its API key; Prometheus reads it from a file, written here at start so
    # it is never committed. The CA verifies Qdrant's certificate.
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:?export QDRANT_API_KEY, e.g. $(openssl rand -hex 16)}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s' "$$QDRANT_API_KEY" > /tmp/qdrant-api-key
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ./certs:/certs:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-19090}:9090"
    mem_limit: 512m
    restart: unless-stopped

  # Delivers alerts to ALERT_WEBHOOK_URL (Slack/Teams/PagerDuty/Opsgenie webhook or any receiver);
  # routing in alertmanager/alertmanager.yml. Refuses to start without a destination.
  # Redis health for Prometheus (up, memory, clients, AOF write status), over TLS as the one ACL user.
  redis-exporter:
    profiles: ["ops"]
    image: oliver006/redis_exporter:v1.96.0
    environment:
      REDIS_ADDR: rediss://redis:6379
      REDIS_USER: chatbot
      REDIS_PASSWORD: ${REDIS_PASSWORD:?export REDIS_PASSWORD, e.g. $(openssl rand -hex 16)}
      REDIS_EXPORTER_TLS_CA_CERT_FILE: /certs/ca.crt
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./certs:/certs:ro
    mem_limit: 64m
    restart: unless-stopped

  alertmanager:
    profiles: ["ops"]
    image: prom/alertmanager:v0.34.2
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -n "$$ALERT_WEBHOOK_URL" ] || { echo "export ALERT_WEBHOOK_URL: where alerts are sent" >&2; exit 1; }
        printf '%s' "$$ALERT_WEBHOOK_URL" > /tmp/alert-webhook-url
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-19093}:9093"
    mem_limit: 128m
    restart: unless-stopped

  # Local OIDC issuer (profile `oidc`, ADR 0016): realm `chatbot` from keycloak/realm.json, at
  # http://localhost:18080/realms/chatbot. Users are not in the committed realm; keycloak-init creates
  # `demo` with KEYCLOAK_DEMO_PASSWORD. Development mode (start-dev), never a production setup.
  keycloak:
    profiles: ["oidc"]
    image: quay.io/keycloak/keycloak:26.8.1
    # The password defaults to empty so commands without this profile need nothing; the container
    # refuses to start without it instead.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        [ -n "$$KC_BOOTSTRAP_ADMIN_PASSWORD" ] || { echo "export KEYCLOAK_ADMIN_PASSWORD" >&2; exit 1; }
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      # Tokens carry iss=http://localhost:<port>/realms/chatbot wherever they are requested from.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HOST_PORT:-18080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-18080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    mem_limit: 1g
    restart: unless-stopped

  keycloak-init:
    profiles: ["oidc"]
    image: quay.io/keycloak/keycloak:26.8.1
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KEYCLOAK_DEMO_PASSWORD: ${KEYCLOAK_DEMO_PASSWORD:-}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        [ -n "$$KEYCLOAK_ADMIN_PASSWORD" ] && [ -n "$$KEYCLOAK_DEMO_PASSWORD" ] ||
          { echo "export KEYCLOAK_ADMIN_PASSWORD and KEYCLOAK_DEMO_PASSWORD" >&2; exit 1; }
        kc=/opt/keycloak/bin/kcadm.sh
        $$kc config credentials --server http://keycloak:8080 --realm master --user admin \
          --password "$$KEYCLOAK_ADMIN_PASSWORD"
        $$kc create users -r chatbot -s username=demo -s enabled=true -s email=demo@example.com \
          -s emailVerified=true -s firstName=Demo -s lastName=User 2>/dev/null || true
        $$kc set-password -r chatbot --username demo --new-password "$$KEYCLOAK_DEMO_PASSWORD"
    restart: "no"

volumes:
  alertmanager-data:
  prometheus-data:
  redis-data:
  kafka-data:
  rag-db-data:
  audit-data:
