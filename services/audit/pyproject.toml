[project]
name = "audit"
version = "0.1.0"
description = "Exports the Redis audit stream to an append-only Postgres table."
requires-python = ">=3.13,<3.14"
dependencies = [
    "chat-common",
    "psycopg[binary]>=3.3.6",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "audit"
module-root = ""

[tool.uv.sources]
chat-common = { workspace = true }
