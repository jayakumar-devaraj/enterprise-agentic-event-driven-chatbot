[project]
name = "worker"
version = "0.1.0"
description = "Kafka worker running the LangGraph pipeline."
requires-python = ">=3.13,<3.14"
dependencies = [
    "chat-common",
    "confluent-kafka>=2.16.0",
    "fastembed>=0.9.0",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-redis>=0.5.2",
    "qdrant-client>=1.19.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker"
module-root = ""

[tool.uv.sources]
chat-common = { workspace = true }
