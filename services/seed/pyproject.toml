[project]
name = "seed"
version = "0.1.0"
description = "One-shot loader for the Qdrant intent and injection collections."
requires-python = ">=3.13,<3.14"
dependencies = [
    "chat-common",
    "fastembed>=0.9.0",
    "qdrant-client>=1.19.1",
    "worker",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "seed"
module-root = ""

[tool.uv.sources]
chat-common = { workspace = true }
worker = { workspace = true }
