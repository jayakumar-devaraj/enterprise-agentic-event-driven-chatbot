[project]
name = "gateway"
version = "0.1.0"
description = "HTTP gateway: auth, guardrails, enqueue, SSE relay."
requires-python = ">=3.13,<3.14"
dependencies = [
    "chat-common",
    "confluent-kafka>=2.16.0",
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gateway"
module-root = ""

[tool.uv.sources]
chat-common = { workspace = true }
