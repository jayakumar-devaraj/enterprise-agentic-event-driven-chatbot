[project]
name = "enterprise-agentic-event-driven-chatbot"
version = "0.1.0"
description = "Event-driven chatbot: PII scrub at ingress, local vector routing, streamed tokens."
requires-python = ">=3.13,<3.14"
dependencies = [
    "chat-common",
    "gateway",
    "worker",
    "seed",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/common", "services/gateway", "services/worker", "services/seed"]

[tool.uv.sources]
chat-common = { workspace = true }
gateway = { workspace = true }
worker = { workspace = true }
seed = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs the real Kafka, Redis and Qdrant from deploy/compose.yaml",
    "scale: needs the stack scaled to 2 gateways + 2 workers (A10)",
]
addopts = "-m 'not integration and not scale'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "BLE"]
