name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest -q --cov=chat_common --cov=gateway --cov=worker --cov=seed
        env:
          COVERAGE_FILE: .coverage.unit
      - name: Figures in the docs match the code
        run: uv run python scripts/gen_figures.py --check
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true

  integration:
    # Real Kafka, Redis, Qdrant and Jaeger from deploy/compose.yaml (verification rung 2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --locked
      - name: Generate infrastructure credentials
        run: |
          echo "REDIS_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "QDRANT_API_KEY=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "KAFKA_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Start infrastructure
        run: |
          docker compose -f deploy/compose.yaml --profile audit up -d --wait kafka redis qdrant jaeger audit-db
          docker compose -f deploy/compose.yaml up --exit-code-from kafka-init kafka-init
        env:
          AUDIT_DB_PASSWORD: ci-admin-password
          AUDIT_WRITER_PASSWORD: ci-writer-password
      - name: Seed Qdrant
        env:
          QDRANT_URL: https://127.0.0.1:16333
          INFRA_CA_FILE: ${{ github.workspace }}/deploy/certs/ca.crt
        run: uv run python -m seed.main
      - name: Integration tests
        run: uv run pytest -m integration -v --cov=chat_common --cov=gateway --cov=worker --cov=seed
        env:
          COVERAGE_FILE: .coverage.integration
          IT_AUDIT_WRITER_URL: postgresql://audit_writer:ci-writer-password@127.0.0.1:15432/audit
          IT_AUDIT_ADMIN_URL: postgresql://audit_admin:ci-admin-password@127.0.0.1:15432/audit
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --tail 100

  durability:
    # Its own compose project: Redis and Kafka survive SIGKILL, replacement and restore (ADR 0008).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --locked
      - name: Generate infrastructure credentials
        run: |
          echo "REDIS_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "QDRANT_API_KEY=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "KAFKA_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          # The worker writes refund audit events to audit-db, which needs both (ADR 0011).
          echo "AUDIT_DB_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "AUDIT_WRITER_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Durability tests
        run: uv run pytest -m durability -v

  oidc:
    # The gateway's OIDC validation against a real issuer: Keycloak's development realm (ADR 0016).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --locked
      - name: Generate infrastructure credentials
        run: |
          for name in REDIS_PASSWORD QDRANT_API_KEY KAFKA_PASSWORD KEYCLOAK_ADMIN_PASSWORD KEYCLOAK_DEMO_PASSWORD; do
            echo "$name=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          done
      - name: Start Kafka, Redis and Keycloak
        run: |
          docker compose -f deploy/compose.yaml --profile oidc up -d --wait kafka redis keycloak
          docker compose -f deploy/compose.yaml --profile oidc up --exit-code-from keycloak-init keycloak-init
          docker compose -f deploy/compose.yaml up --exit-code-from kafka-init kafka-init
      - name: OIDC tests
        run: uv run pytest -m oidc -v
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml --profile oidc logs --tail 100

  frontend:
    runs-on: ubuntu-latest
    container: node:24.22.2-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  alerts:
    # Each alert rule fires on the synthetic series it is meant for and stays quiet otherwise, and a
    # firing alert reaches a webhook through Alertmanager.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Prometheus config and alert rule tests
        run: |
          # --syntax-only: the Qdrant key file and the CA exist only inside the running container.
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool             prom/prometheus:v3.15.1 check config --syntax-only /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool             prom/prometheus:v3.15.1 check rules /etc/prometheus/alerts.yml
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" -w /etc/prometheus             --entrypoint promtool prom/prometheus:v3.15.1 test rules alerts_test.yml
      - name: Alertmanager config
        run: |
          docker run --rm -v "$PWD/deploy/alertmanager:/etc/alertmanager:ro" --entrypoint amtool \
            prom/alertmanager:v0.34.2 check-config /etc/alertmanager/alertmanager.yml
      - name: Generate infrastructure credentials
        run: |
          for name in REDIS_PASSWORD QDRANT_API_KEY KAFKA_PASSWORD; do
            echo "$name=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          done
      - name: Alert delivery
        run: uv sync --locked && uv run pytest -m ops -v

  docs:
    # Documents must not point at anything that does not exist, and every diagram must render.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Links and orchestration references
        run: python3 scripts/check_docs.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Mermaid diagrams render
        run: |
          npm install --no-save --silent @mermaid-js/mermaid-cli@12.0.0
          for f in $(git ls-files '*.md' | xargs grep -l '^```mermaid'); do
            echo "rendering $f"
            npx mmdc -p .github/mermaid-puppeteer.json -i "$f" -o "$RUNNER_TEMP/out.md" -q
          done

  coverage:
    # One report from the unit and integration runs of this commit; commit it as docs/reports/coverage.txt.
    needs: [lint-and-unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combined coverage report
        run: |
          uv run coverage combine .coverage.unit .coverage.integration
          { echo "Coverage at ${GITHUB_SHA::7} from CI run ${GITHUB_RUN_ID} (unit + integration; scale, llm, durability and stack tests need special stacks):"; uv run coverage report; } | tee coverage.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: coverage.txt
