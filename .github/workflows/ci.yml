name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest -q

  integration:
    # Real Kafka, Redis, Qdrant and Jaeger from deploy/compose.yaml (verification rung 2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --locked
      - name: Start infrastructure
        run: |
          docker compose -f deploy/compose.yaml up -d --wait kafka redis qdrant jaeger
          docker compose -f deploy/compose.yaml up --exit-code-from kafka-init kafka-init
      - name: Seed Qdrant
        env:
          QDRANT_URL: http://127.0.0.1:16333
        run: uv run python -m seed.main
      - name: Integration tests
        run: uv run pytest -m integration -v
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --tail 100

  durability:
    # Its own compose project: Redis and Kafka survive SIGKILL, replacement and restore (ADR 0008).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --locked
      - name: Durability tests
        run: uv run pytest -m durability -v

  frontend:
    runs-on: ubuntu-latest
    container: node:24.22.0-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  docs:
    # Documents must not point at anything that does not exist, and every diagram must render.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Links and orchestration references
        run: python3 scripts/check_docs.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Mermaid diagrams render
        run: |
          npm install --no-save --silent @mermaid-js/mermaid-cli@12.0.0
          for f in $(git ls-files '*.md' | xargs grep -l '^```mermaid'); do
            echo "rendering $f"
            npx mmdc -p .github/mermaid-puppeteer.json -i "$f" -o "$RUNNER_TEMP/out.md" -q
          done
